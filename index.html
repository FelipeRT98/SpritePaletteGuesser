<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Sprite Palette Guesser</title>
    <meta name="application-name" content="Sprite Palette Guesser" />
    <meta name="version" content="1.0" />

    <!--<link rel="icon" type="image/svg" href="./SpritePaletteGuesser-Icon.svg" />-->

    <meta name="author" content="Felipe Rodrigues" />
    <meta name="description" content="A browser game where you identify sprites from their color palette." />
    <meta name="keywords" content="sprite, palette, pixel art, video games, guesser, guessing game, Pokémon, HTML, CSS, JavaScript, browser, quiz, sprite sheet, gaming, web, pixel" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Courier New", monospace;
            font-size: 16px;
            font-weight: normal;
            border: none;
            border-style: none;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            overflow-y: hidden;
        }

        /* Real screen */
        #screen {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background-image: linear-gradient(to bottom, black, whitesmoke, white);
        }

        /* Virtual internal resolution */
        #app {
            width: 1600px;
            height: 900px;
            position: absolute;
            transform-origin: top left;
            background-image: linear-gradient(to bottom, black, white);
            color: white;
        }

        h1 {
            font-weight: 1000;
            font-size: 40px;
            text-align: center;
        }

        table {
            width: 900px;
            height: 100%;
            position: relative;

            margin-left: auto;
            margin-right: auto;

            border-collapse: collapse;
        }

        td {
            text-align: center;
            vertical-align: middle;
            min-width: 450px;
            width: 450px;
            max-width: 450px;
        }

        td.top {
            vertical-align: top;
        }

        button {
            border: none;
            background: none;
            background-image: none;
        }

        .clickable {
            background-image: linear-gradient(white, lightblue, cyan);
            font-weight: bold;
        }

        .clickable:not(:disabled):hover,
        .clickable:not(:disabled):focus {
            background-image: none;

            background-color: blue;
            color: yellow;

            cursor: pointer;
        }

        .clickable:active {
            background: yellow !important;
            color: blue !important;
        }

        select.clickable option {
            background-color: white;
            color: black;
        }

        select.clickable option:checked {
            background-color: white;
            color: black;
        }

        select {
            font-size: 2ch;
        }

        #resetButton {
            font-size: 2ch;
        }

        .imageDisplay {
            width: 300px;
            height: 300px;

            margin-left: auto;
            margin-right: auto;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .imageDisplay img {
            width: 100%;
            height: 100%;

            max-width: 100%;
            max-height: 100%;

            object-fit: contain;

            image-rendering: pixelated;
        }

        #search {
            position: relative;

            width: 300px;
            display: flex;
            justify-content: center;
            align-items: center;

            margin: 0 auto;
        }

        #searchInput {
            width: 100%;
            height: 4ch;
        }

        #searchButton {
            position: absolute;

            top: 0;
            right: 0;

            width: 4ch;
            height: 4ch;

            cursor: pointer;
        }

        #searchResults {
            position: absolute;

            top: 4ch;
            left: 0;

            width: 100%;
            max-height: 300px;

            overflow-y: auto;

            display: none;

            z-index: 1000;
        }

        .searchResult {
            width: 100%;
            height: 4ch;

            background: white;

            text-align: left;

            cursor: pointer;
        }

        .searchResult:not(:disabled):hover {
            background: blue;
            color: yellow;
            font-weight: bold;
        }

        :disabled:hover,
        :disabled:focus,
        :disabled:active {
            cursor: default;
        }

        #guessLog {
            width: 300px;
            height: 300px;

            resize: none;

            padding: 10px;

            background: none;
            color: white;

            overflow-y: auto;
        }
    </style>
</head>

<body>
    <div id="screen">
        <div id="app">
            <h1>Sprite Palette Guesser</h1>
            <table>
                <tr>
                    <td>
                        <select name="dataDropdown" id="dataDropdown" class="clickable" onchange="prepareGame()">
                            <option value="0" selected>---</option>
                            <option value="dataPokemonEmeraldPokemonFront">Pokemon Emerald - Pokemon Front</option>
                        </select>
                    </td>
                    <td class="hidable" hidden>
                        <button id="resetButton" class="clickable" onclick="newGuess()">New Guess</button>
                    </td>
                </tr>
                <tr>
                    <td class="hidable" hidden>
                        <div class="imageDisplay" id="colorMapImageDisplay"></div>
                    </td>
                    <td class="hidable" hidden>
                        <textarea id="guessLog" readonly tabindex="-1" style="pointer-events: none;"></textarea>
                    </td>
                </tr>
                <tr>
                    <td class="hidable" hidden>
                        <div class="imageDisplay" id="originalImageDisplay" style="margin: 0 auto;"></div>
                    </td>
                    <td class="hidable top" hidden>
                        <div id="search">
                            <input id="searchInput" oninput="searchInputChange()" type="text" autocomplete="off" placeholder="Search...">

                            <button id="searchButton" type="button" onclick="searchButtonClick()" aria-label="Show all" class="clickable">▼</button>

                            <div id="searchResults"></div>
                        </div>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <script src="./dataPokemonEmeraldPokemonFront.js"></script>

    <script>

        const app = document.getElementById("app");
        const LANDSCAPE_WIDTH = 1600;
        const LANDSCAPE_HEIGHT = 900;
        const PORTRAIT_WIDTH = 900;
        const PORTRAIT_HEIGHT = 1600;

        function resizeApp() {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;

            const isPortrait = screenHeight > screenWidth;

            const internalWidth = isPortrait ? PORTRAIT_WIDTH : LANDSCAPE_WIDTH;
            const internalHeight = isPortrait ? PORTRAIT_HEIGHT : LANDSCAPE_HEIGHT;

            /* * Update the virtual application's dimensions. */
            app.style.width = `${internalWidth}px`;
            app.style.height = `${internalHeight}px`;

            /* * Scale while preserving aspect ratio. */
            const scale = Math.min(screenWidth / internalWidth, screenHeight / internalHeight);

            /* * Final displayed size. */
            const scaledWidth = internalWidth * scale;
            const scaledHeight = internalHeight * scale;

            /* * Center horizontally and vertically. */
            const offsetX = (screenWidth - scaledWidth) / 2;
            const offsetY = (screenHeight - scaledHeight) / 2;
            app.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
        }

        window.addEventListener("resize", resizeApp);

        resizeApp();

        // ##############################################################################################
        // ##############################################################################################
        // ##############################################################################################
        // ##############################################################################################
        // ##############################################################################################

        const DATASETS = {
            dataPokemonEmeraldPokemonFront: dataPokemonEmeraldPokemonFront,
        };

        const COLORMAPIMAGE_DISPLAY = document.getElementById("colorMapImageDisplay");
        const ORIGINALIMAGE_DISPLAY = document.getElementById("originalImageDisplay");

        const SEARCH = document.getElementById("search");
        const SEARCH_INPUT = document.getElementById("searchInput");
        const SEARCH_BUTTON = document.getElementById("searchButton");
        const SEARCH_RESULTS = document.getElementById("searchResults");

        const GUESS_LOG = document.getElementById("guessLog");
        const RESET_BUTTON = document.getElementById("resetButton");

        const DATA_DROPDOWN = document.getElementById("dataDropdown");

        const RETRIES = 6;

        const HIDABLE_ELEMENTS = Array.from(document.getElementsByClassName("hidable"));

        let KEYS;
        let DATA;
        let REMAINING_TRIES = RETRIES;
        let RANDOM_KEY;

        // ##############################################################################################

        let colorMapImageElement = document.createElement("img");
        let originalImageElement = document.createElement("img");

        // ##############################################################################################
        // ##############################################################################################
        // ##############################################################################################
        // ##############################################################################################
        // ##############################################################################################

        function getRandomKey() {
            return KEYS[Math.floor(Math.random() * KEYS.length)];
        }

        function showGame() {
            HIDABLE_ELEMENTS.forEach((hidableElement) => {
                hidableElement.hidden = false;
            });
        }

        function hideGame() {
            HIDABLE_ELEMENTS.forEach((hidableElement) => {
                hidableElement.hidden = true;
            });
        }

        function prepareGame() {

            if (DATA_DROPDOWN.value === "0") {
                hideGame();
                return;
            }

            DATA = DATASETS[DATA_DROPDOWN.value];

            KEYS = Object.keys(DATA);

            REMAINING_TRIES = RETRIES;

            newGuess();

            fillSearchDropdown();

        }


        function newGuess() {
            RANDOM_KEY = getRandomKey();
            const object = DATA[RANDOM_KEY];

            colorMapImageElement.src = object.colorMap;
            originalImageElement.src = object.image;

            COLORMAPIMAGE_DISPLAY.replaceChildren(colorMapImageElement);
            ORIGINALIMAGE_DISPLAY.replaceChildren(originalImageElement);

            SEARCH_INPUT.value = "";
            SEARCH_RESULTS.style.display = "none";

            GUESS_LOG.value = "";

            REMAINING_TRIES = RETRIES;
            originalImageElement.hidden = true;

            colorMapImageElement.onload = () => {
                colorMapImageElement.title =
                    `⌜\n\n${colorMapImageElement.naturalWidth} x ${colorMapImageElement.naturalHeight}`;
            };

            showGame();

            SEARCH_RESULTS.querySelectorAll(":disabled").forEach(button => {
                button.disabled = false;
            });

            SEARCH_INPUT.focus();
        }

        function fillSearchDropdown() {
            SEARCH_RESULTS.replaceChildren();
            for (const key of KEYS) {
                const button = document.createElement("button");
                button.className = "searchResult";
                button.type = "button";
                button.textContent = key;
                button.onclick = () => submitGuess(key, button);
                button.hidden = true;
                SEARCH_RESULTS.appendChild(button);
            }
        }

        function submitGuess(key, button) {
            SEARCH_INPUT.value = key;
            SEARCH_RESULTS.style.display = "none";

            const correctGuess = (SEARCH_INPUT.value === RANDOM_KEY);

            --REMAINING_TRIES;
            GUESS_LOG.value += `${REMAINING_TRIES}/${RETRIES} ${key}\n`;

            button.disabled = true;

            if (correctGuess === true || REMAINING_TRIES <= 0) {
                SEARCH.parentElement.hidden = true;
                ORIGINALIMAGE_DISPLAY.firstChild.hidden = false;
            }
        }

        function setSearchButtonsVisibility(searchText) {
            let visibleButtons = 0;
            for (const button of SEARCH_RESULTS.children) {
                const match = button.textContent.includes(searchText);

                button.hidden = !match;

                if (match) visibleButtons++;
            }
            SEARCH_RESULTS.style.display = visibleButtons ? "block" : "none";
        }

        function searchInputChange() {
            const searchText = SEARCH_INPUT.value.toLowerCase();

            if (!searchText) {
                SEARCH_RESULTS.style.display = "none";
                return;
            }

            setSearchButtonsVisibility(searchText);
        }

        function searchButtonClick() {
            const open = SEARCH_RESULTS.style.display === "block";

            // Close if already open
            if (open) {
                SEARCH_RESULTS.style.display = "none";
                return;
            }

            // Show every button.
            for (const button of SEARCH_RESULTS.children) {
                button.hidden = false;
            }

            SEARCH_RESULTS.style.display = "block";
        }

        // ##############################################################################################

        document.addEventListener("click", event => {
            if (!SEARCH.contains(event.target)) { SEARCH_RESULTS.style.display = "none"; }
        });

    </script>
</body>

</html>
